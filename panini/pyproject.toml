[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "panini-compiler"
version = "0.1.0"
description = "Reference compiler frontend for the Panini language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["lark[interegular]>=1.2,<2"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9"]

[project.scripts]
panini = "panini_compiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panini_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
