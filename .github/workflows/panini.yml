name: Panini
on:
  push:
    branches: [alphaxiv]
  pull_request:
    branches: [alphaxiv]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation and build dependencies
        run: python -m pip install --require-hashes -r panini/requirements-validation.txt
      - name: Build and install reference wheel
        run: |
          python -m build --no-isolation --outdir /tmp/panini-dist panini
          python -m pip install --no-deps /tmp/panini-dist/*.whl
      - name: Run conformance and evaluation tests
        run: python -m pytest panini/tests
